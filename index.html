<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="双面迷宫：每条隧道都是一口贯穿正反两面的竖井，在两面同一坐标，必须不断穿梭才能抵达终点。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1020'/%3E%3Cpath d='M8 8h16v16H8z' fill='none' stroke='%2338e6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffc861'/%3E%3C/svg%3E">
<title>双面迷宫 · Dual-Face Maze</title>
<style>
  :root {
    --front: #38e6ff;
    --back: #c08cff;
    --gold: #ffc861;
    --green: #5dffa8;
    --ink: #e8f4ff;
    --muted: #8fa4c0;
    --panel: rgba(14, 22, 40, 0.82);
    --line: rgba(120, 190, 255, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070f; color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; }

  /* ---------- 顶部栏（HUD + 关卡标题，垂直流式，换行不会重叠） ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 14px 0; pointer-events: none;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; flex-wrap: wrap;
  }
  .hud-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; line-height: 1; white-space: nowrap;
  }
  .chip .k { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
  .chip .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .face-chip .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--front); box-shadow: 0 0 10px var(--front);
    transition: background .25s, box-shadow .25s;
  }
  .face-chip.back .dot { background: var(--back); box-shadow: 0 0 10px var(--back); }

  #level-title { text-align: center; pointer-events: none; }
  #level-title .lt-main {
    font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #cfe6ff;
    text-shadow: 0 0 14px rgba(80,160,255,.45);
  }
  #level-title .lt-sub { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 1px; }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(10,18,34,.92); border: 1px solid var(--line);
    color: #dcecff; opacity: 0; transition: opacity .18s, transform .18s;
    pointer-events: none; white-space: nowrap; max-width: 86vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.warn { color: #ffd9a0; border-color: rgba(255,200,97,.4); }

  /* ---------- Toolbar ---------- */
  #toolbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font-size: 13px; font-weight: 600; font-family: inherit;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .12s, border-color .2s, background .2s;
  }
  .btn:hover { border-color: rgba(120,190,255,.42); }
  .btn:active { transform: scale(.94); }
  .btn.on { border-color: var(--gold); color: var(--gold); }
  .btn kbd {
    font-family: inherit; font-size: 10px; padding: 2px 5px; border-radius: 5px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: var(--muted);
  }

  /* ---------- 穿梭按钮（站在隧道洞口时出现） ---------- */
  .warp-btn {
    position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%) scale(.88);
    display: flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,200,97,.62); color: #ffe6b8;
    font-weight: 800; font-size: 15px; font-family: inherit; letter-spacing: 3px;
    background: rgba(58,38,8,.74); box-shadow: 0 0 26px rgba(255,200,97,.28);
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .warp-btn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
  .warp-btn small { font-size: 10px; opacity: .6; font-weight: 600; letter-spacing: 0; }

  /* ---------- Overlay ---------- */
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(6,10,20,.82), rgba(3,5,12,.95));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 24px; z-index: 20; transition: opacity .28s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel {
    width: min(480px, 100%); max-height: 88vh; overflow: auto;
    background: linear-gradient(160deg, rgba(18,28,50,.95), rgba(10,16,30,.96));
    border: 1px solid var(--line); border-radius: 20px; padding: 26px 26px 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    animation: rise .34s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  .panel h2 {
    margin: 0 0 4px; font-size: 24px; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--front), var(--back));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .panel p { font-size: 13.5px; line-height: 1.75; color: #c3d5ea; margin: 8px 0; }
  .panel ul { margin: 8px 0; padding-left: 20px; font-size: 13.5px; line-height: 1.85; color: #c3d5ea; }
  .panel b { color: #fff; }
  .panel .tag {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    background: rgba(56,230,255,.14); border: 1px solid rgba(56,230,255,.35); color: var(--front);
  }
  .panel .tag.gold { background: rgba(255,200,97,.14); border-color: rgba(255,200,97,.38); color: var(--gold); }
  .panel .tag.green { background: rgba(93,255,168,.14); border-color: rgba(93,255,168,.38); color: var(--green); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; margin: 16px 0 4px; }
  .stat {
    background: rgba(255,255,255,.045); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; text-align: center;
  }
  .stat .sv { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .sk { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .primary {
    margin-top: 18px; width: 100%; padding: 13px; border-radius: 13px; cursor: pointer;
    border: none; font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1px;
    color: #04121a; background: linear-gradient(95deg, var(--front), #7ef0d0);
    box-shadow: 0 10px 28px rgba(56,230,255,.26); transition: transform .12s, filter .2s;
  }
  .primary:hover { filter: brightness(1.07); }
  .primary:active { transform: scale(.97); }
  .row-actions { display: flex; gap: 10px; margin-top: 12px; }
  .row-actions .btn { flex: 1; justify-content: center; padding: 11px; }

  .rank { text-align: center; margin: 10px 0 0; font-size: 14px; font-weight: 700; color: var(--gold); }

  @media (max-width: 560px) {
    .chip { padding: 6px 10px; font-size: 12px; }
    .chip .k { font-size: 10px; }
    .btn { padding: 8px 13px; font-size: 12px; }
    .panel { padding: 20px 18px 18px; border-radius: 16px; }
    .panel h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="topbar">
    <header id="hud">
      <div class="hud-group">
        <div class="chip"><span class="k">关卡</span><span class="v" id="ui-level">1/6</span></div>
        <div class="chip face-chip" id="ui-face"><i class="dot"></i><span class="v" id="ui-face-text">正面</span></div>
      </div>
      <div class="hud-group">
        <div class="chip"><span class="k">隧道</span><span class="v" id="ui-tunnels">0/3</span></div>
        <div class="chip"><span class="k">符印</span><span class="v" id="ui-crystals">0/6</span></div>
        <div class="chip"><span class="k">步数</span><span class="v" id="ui-steps">0</span></div>
        <div class="chip"><span class="k">时间</span><span class="v" id="ui-time">00:00</span></div>
      </div>
    </header>

    <div id="level-title">
      <div class="lt-main" id="lt-main">初窥双面</div>
      <div class="lt-sub" id="lt-sub">第 1 关 · 3 口竖井</div>
    </div>
  </div>

  <div id="toast"></div>

  <button class="warp-btn" id="btn-warp">穿 梭<small>空格</small></button>

  <footer id="toolbar">
    <button class="btn" id="btn-hint"><span>提示</span><kbd>H</kbd></button>
    <button class="btn" id="btn-reset"><span>重来</span><kbd>R</kbd></button>
    <button class="btn" id="btn-sound"><span>音效</span><kbd>M</kbd></button>
    <button class="btn" id="btn-help"><span>玩法</span><kbd>?</kbd></button>
  </footer>

  <div id="overlay" class="overlay">
    <div class="panel">
      <h2 id="ov-title">双面迷宫</h2>
      <div class="sub" id="ov-sub">Dual-Face Maze</div>
      <div id="ov-body"></div>
      <button class="primary" id="ov-btn">开始</button>
      <div class="row-actions" id="ov-actions" style="display:none">
        <button class="btn" id="ov-retry">重玩本关</button>
        <button class="btn" id="ov-menu">回到玩法</button>
      </div>
    </div>
  </div>
</div>

<script src="src/maze.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
